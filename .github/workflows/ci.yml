name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Clean spec must pass and be self-proven (rc 0)
        run: python hallmark_gates_mutate.py examples/in/gates.md

      - name: Broken spec must be rejected (rc 1)
        run: |
          set +e
          python hallmark_gates_mutate.py examples/in/gates-broken.md
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::expected rc=1 from examples/in/gates-broken.md, got rc=$rc"
            exit 1
          fi
